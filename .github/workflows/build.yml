name: "MCP Server: Build and Deploy"

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      deploy_action:
        description: "Deploy action"
        required: false
        default: "build only"
        type: choice
        options:
          - "build only"
          - "build + deploy"

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build .mcpb
        run: npx @anthropic-ai/mcpb@2.1.2 pack

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipinfo-mcp-server.mcpb
          path: "*.mcpb"

      - name: Attest build provenance
        id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.mcpb"

      # Scorecard's Signed-Releases check looks for provenance among the
      # release assets, so attach the attestation bundle to the release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp "$BUNDLE_PATH" provenance.intoto.jsonl
          gh release create "${{ github.ref_name }}" *.mcpb provenance.intoto.jsonl --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Determine image tag
        id: get_tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 2400s

      - name: Login to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_REGISTRY }}/mcp:${{ steps.get_tag.outputs.tag }}
            ${{ secrets.GCP_REGISTRY }}/mcp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions: {}
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_action == 'build + deploy')
    steps:
      - name: Trigger deploy in ipinfo/mcp-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            --repo ipinfo/mcp-release \
            --ref main \
            --field tag="${{ needs.build.outputs.tag }}"
