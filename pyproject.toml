[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipinfo-mcp-server"
version = "0.1.6"
description = "Official IPinfo MCP Server - IP intelligence tools for AI assistants"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "IPinfo", email = "support@ipinfo.io" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.15.5",
]


[project.scripts]
ipinfo-mcp-server = "ipinfo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ipinfo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit the real IPinfo API (deselect with '-m \"not integration\"')",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
exclude = [".venv", "tests"]

[tool.ruff]
exclude = [".venv", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
